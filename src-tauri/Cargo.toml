[package]
name = "forma"
version = "0.2.0"
description = "A private, persistent AI chat workspace"
authors = ["Desktop AI Dashboard contributors"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "forma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros", "process", "io-util"] }
tokio-util = "0.7"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSProcessInfo", "NSString", "NSURL", "NSUUID"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKBackForwardList", "WKBackForwardListItem", "WKContentRuleList", "WKContentRuleListStore", "WKNavigation", "WKUserContentController", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
